services:
  postgres:
    image: postgres:16-alpine
    container_name: agro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrobasket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrobasket}
      POSTGRES_DB: ${POSTGRES_DB:-agrobasket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobasket} -d ${POSTGRES_DB:-agrobasket}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Flask — identity provider + admin dashboard/moderation API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agro_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agrobasket:agrobasket@postgres:5432/agrobasket}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agrobasket.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI — marketplace REST API
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: agro_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agrobasket:agrobasket@postgres:5432/agrobasket}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend — Vite dev server (PWA). For production, build and deploy to Vercel.
  frontend:
    build: ./frontend
    container_name: agro_frontend
    restart: unless-stopped
    environment:
      VITE_AUTH_API_URL: http://localhost:${BACKEND_PORT:-5001}
      VITE_MARKET_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
      - api

  # Idempotent seeders: roles, admin/demo users, categories, demo listings
  seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.seed
    container_name: agro_seed
    entrypoint: ["python", "infra/seed_all.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agrobasket:agrobasket@postgres:5432/agrobasket}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agrobasket.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SEED_DEMO_ITEMS: ${SEED_DEMO_ITEMS:-true}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
